<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />

    <!-- PWA Supporting Meta Tags -->
    <link rel="manifest" href="/manifest.json?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Delivery Tracker" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" href="/icon-192.png?v=2" />

    <title>ডেলিভারি ট্র্যাকার - Delivery Tracker</title>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0f1e;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      * {
        box-sizing: border-box;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(100,255,218,0.2);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker in production/live mode -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('ServiceWorker registered:', reg.scope);
              // Force checking for updates immediately
              reg.update();
            })
            .catch(err => console.error('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
